# Argus analytics layer: PostgreSQL run history + Grafana dashboards.
#
#   docker compose -f analytics/docker-compose.yml up -d
#   python analytics/import_runs.py --watch
#
# Both ports bind to 127.0.0.1 only. Credentials are local-development
# defaults; override them with environment variables for anything shared.
name: argus-analytics

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: argus_analytics
      POSTGRES_USER: argus_owner
      POSTGRES_PASSWORD: ${ARGUS_DB_PASSWORD:-argus_owner_local}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:-grafana_reader_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - argus-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_owner -d argus_analytics"]
      interval: 3s
      retries: 20

  grafana:
    image: grafana/grafana-oss:11.4.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3300/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-argus-admin}
      # Read-only viewing without a login, so the Argus "Analytics" link opens
      # straight onto the dashboard. Editing still needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/argus-observatory.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:-grafana_reader_local}
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  argus-pg:
