apiVersion: 1

datasources:
  - name: Argus runs
    uid: argus-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: argus_analytics
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
